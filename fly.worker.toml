# fly.toml app configuration file generated for plotline-worker on 2026-04-13T13:04:24-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plotline-worker'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile.fly'
  # GIT_SHA / BUILT_AT are passed by CI on the deploy command rather than
  # pinned in a [build.args] table — see fly.toml for why.

[env]
  APP_ENV = 'production'
  TITILER_URL = 'https://plotline-titiler.fly.dev'

[processes]
  worker = 'celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2'

[[vm]]
  # 1 GB, not 512 MB: the 2026-08 ops audit caught a live OOM kill of a
  # ForkPoolWorker inside a 20-minute log window (total-vm 766 MB against a
  # 512 MB machine), and a SIGKILLed worker leaves its request rows stranded.
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
