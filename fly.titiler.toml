# fly.toml app configuration file generated for plotline-titiler on 2026-03-30T13:17:48-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plotline-titiler'
primary_region = 'lax'

[build]
  image = 'ghcr.io/developmentseed/titiler:1.2.1'

[env]
  # Nothing in Plotline uses /mosaicjson; left enabled it was a free mosaic
  # renderer for anyone (security audit SEC-1). The access token itself is
  # a Fly secret (TITILER_API_GLOBAL_ACCESS_TOKEN), never a value here.
  TITILER_API_DISABLE_MOSAIC = 'TRUE'
  MAX_WORKERS = '2'
  WORKERS_PER_CORE = '1'
  GDAL_DISABLE_READDIR_ON_OPEN = 'EMPTY_DIR'
  VSI_CACHE = 'TRUE'
  VSI_CACHE_SIZE = '268435456'
  GDAL_CACHEMAX = '200'
  CPL_VSIL_CURL_ALLOWED_EXTENSIONS = '.tif,.tiff'
  GDAL_HTTP_MERGE_CONSECUTIVE_RANGES = 'YES'
  GDAL_HTTP_MULTIPLEX = 'YES'
  GDAL_HTTP_MAX_RETRY = '3'
  GDAL_HTTP_RETRY_DELAY = '1'
  # No knob here bounds the STAC item cache. rio-tiler 8.0.5 caches fetched
  # items in a module-level LRUCache(maxsize=512) with no TTL
  # (rio_tiler/io/stac.py:100-102), keyed on the item URL; it reads no
  # environment variable, and RIO_TILER_CACHE_* does not exist in rio-tiler or
  # titiler. An entry lives until 512-slot eviction or process restart, which
  # is how a cached SAS token outlived its expiry by hours and 502'd every
  # Landsat tile for that snapshot. The fix is on the API side: the Landsat
  # /stac callback URL carries the token's expiry, so the cache key rotates
  # with the token. See docs/audits/2026-08-titiler-cache/FINDINGS.md.

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
