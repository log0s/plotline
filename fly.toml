app = "log0s-plotline-api"
   primary_region = "lax"

   [build]
     dockerfile = "Dockerfile.fly"
     # GIT_SHA / BUILT_AT deliberately live in the deploy command, not in a
     # [build.args] table here: a value committed to this file is a constant,
     # so it would either go stale immediately or mask the SHA the CLI passes.
     # CI supplies both via `flyctl deploy --build-arg` (deploy.yml).

   [env]
     APP_ENV = "production"
     TITILER_URL = "https://plotline-titiler.fly.dev"
     # Public, deliberately: Titiler calls back to the API for signed STAC
     # items, so this traffic crosses the public internet. Internal
     # networking was implemented and reverted in c6213d5 — Fly's .internal
     # addresses resolve to IPv6 only, which broke API→Titiler. Do not
     # re-attempt without IPv6 support on both apps.
     API_INTERNAL_URL = "https://log0s-plotline-api.fly.dev"

   [http_service]
     internal_port = 8000
     force_https = true
     auto_stop_machines = "off"
     auto_start_machines = true
     min_machines_running = 1

   [[vm]]
     memory = "512mb"
     cpu_kind = "shared"
     cpus = 1