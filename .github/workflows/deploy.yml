name: Deploy

on:
  push:
    branches: [main]
  # Escape hatch: path filters only see the commits in a single push, so a
  # failed run followed by a push that touches no filtered path leaves main
  # ahead of prod with CI green. Dispatch redeploys from the current main.
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy API and worker regardless of changed paths"
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      api: ${{ steps.resolve.outputs.api }}
      worker: ${{ steps.resolve.outputs.worker }}
      titiler: ${{ steps.resolve.outputs.titiler }}
      frontend: ${{ steps.resolve.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: the deployed SHA below can be arbitrarily far
          # behind HEAD (a queue outage can collapse many pushes), and a
          # shallow clone would make it unreachable for `git diff`/merge-base.
          fetch-depth: 0
      # A push diffed against its own parent only sees that one push's
      # commits. When a run never happens (queue outage, cancelled run) the
      # next push's parent-diff still skips whatever the missed push touched.
      # /api/v1/health reports the SHA actually running in prod, so diffing
      # against that instead answers "does prod match main" rather than
      # "did this push touch the backend."
      - name: Determine diff base (deployed SHA, falling back to parent commit)
        id: base
        if: github.event_name == 'push'
        run: |
          set +e
          deployed=$(curl -sf --max-time 10 https://log0s-plotline-api.fly.dev/api/v1/health | jq -r '.version.sha // empty')
          curl_status=$?
          set -e

          base=""
          reason=""
          if [ "$curl_status" -ne 0 ] || [ -z "$deployed" ]; then
            reason="health check unreachable or returned no sha"
          elif ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            reason="deployed sha $deployed not found in this clone's history"
          elif ! git merge-base --is-ancestor "$deployed" "${{ github.sha }}"; then
            reason="deployed sha $deployed is not an ancestor of HEAD (rollback?)"
          else
            base="$deployed"
          fi

          # Fall back to the previous behaviour (parent commit) rather than
          # silently treating the push as having no changes.
          if [ -z "$base" ]; then
            echo "::warning::${reason}; falling back to parent commit ${{ github.event.before }}"
            fallback="${{ github.event.before }}"
            if [ -n "$fallback" ] && [ "$fallback" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${fallback}^{commit}" 2>/dev/null; then
              base="$fallback"
            else
              echo "::warning::parent commit also unavailable; treating everything as changed"
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Log diff base for this run
        if: github.event_name == 'push'
        run: |
          {
            echo "### Change detection"
            echo "- base: \`${{ steps.base.outputs.sha || '(none — everything counts as changed)' }}\`"
            echo "- head: \`${{ github.sha }}\`"
            echo "- changed paths:"
            echo '```'
            if [ -n "${{ steps.base.outputs.sha }}" ]; then
              git diff --name-only "${{ steps.base.outputs.sha }}" "${{ github.sha }}"
            else
              echo "(base unknown — all deploy/test jobs run)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Only meaningful for a push diff with a resolved base; on dispatch, or
      # when no base could be resolved, it is skipped and `resolve` below
      # marks every output true.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push' && steps.base.outputs.sha != ''
        with:
          base: ${{ steps.base.outputs.sha }}
          # scripts/ is copied into the image by Dockerfile.fly, so a
          # scripts-only change must rebuild or it never reaches prod.
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile.fly'
            api:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile.fly'
              - 'fly.toml'
            worker:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile.fly'
              - 'fly.worker.toml'
            titiler:
              - 'fly.titiler.toml'
            frontend:
              - 'frontend/**'

      - name: Resolve outputs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -z "${{ steps.base.outputs.sha }}" ]; then
            for k in backend api worker titiler frontend; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "titiler=${{ steps.filter.outputs.titiler }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The suite builds its own schema as hand-written DDL against in-memory
    # SQLite, so until this service existed nothing in CI ever executed a
    # migration — which is how X1 shipped: alembic reported a successful
    # upgrade, committed nothing, and exited 0. tests/test_migrations_postgres.py
    # needs a real server, and fails rather than skips when CI does not give it
    # one. PostGIS rather than plain postgres because migration 0001 creates
    # the extension.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: plotline
          POSTGRES_PASSWORD: plotline
          POSTGRES_DB: plotline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plotline -d plotline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.x"
          python-version: "3.12"
      - name: Run backend tests
        env:
          # A maintenance connection: the migration tests create and drop their
          # own throwaway databases and never touch this one.
          TEST_POSTGRES_URL: postgresql://plotline:plotline@localhost:5432/plotline
        run: |
          cd backend
          uv sync --locked --extra dev
          uv run --no-sync pytest -v

  # Blocking as a signal: a red run is visible on the PR and must be dealt
  # with. It still gates no deploy — the frontend ships through the Cloudflare
  # Pages GitHub integration, which watches the repo directly and never reads
  # an Actions result — so this job is deliberately absent from every deploy
  # job's needs. A real gate (a wrangler-driven Pages deploy behind this job)
  # is deferred to its own pass.
  #
  # The suite deliberately contains one test expected to fail, via it.fails:
  # H1's decennial half in HousingChart.test.tsx. (It was four until L8's
  # clear-before-resolve fix removed the three SearchInput.test.tsx markers in
  # the same commit that fixed the bug — the mechanism below, working.) Vitest
  # counts an it.fails test whose body throws as a pass, so the suite exits 0
  # with it present. When that bug is fixed the assertion starts passing,
  # it.fails reports it as a failure, and this job goes red — the fixing
  # commit must remove the marker and turn the test into an ordinary
  # regression guard. That is intended, not a broken test. See the
  # frontend-harness note in docs/audits/2026-08-second-audit/STATUS.md.
  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm test

  deploy-api:
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (master on 2026-08-22)
      # --build-arg stamps the image with the commit it was built from, so
      # GET /api/v1/health reports what is actually deployed.
      - run: |
          flyctl deploy --remote-only \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-worker:
    needs: [changes, test]
    if: needs.changes.outputs.worker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (master on 2026-08-22)
      - run: |
          flyctl deploy --remote-only --config fly.worker.toml \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-titiler:
    needs: changes
    if: needs.changes.outputs.titiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (master on 2026-08-22)
      - run: flyctl deploy --remote-only --config fly.titiler.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Frontend auto-deploys via Cloudflare Pages GitHub integration.
  # No explicit job needed if you connected the repo in the dashboard.
