name: Deploy

on:
  push:
    branches: [main]
  # Escape hatch: path filters only see the commits in a single push, so a
  # failed run followed by a push that touches no filtered path leaves main
  # ahead of prod with CI green. Dispatch redeploys from the current main.
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy API and worker regardless of changed paths"
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      titiler: ${{ steps.filter.outputs.titiler }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Only meaningful for a push diff; on dispatch it is skipped and the
      # outputs come back empty, so the deploy jobs fall through to their
      # workflow_dispatch condition.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          # scripts/ is copied into the image by Dockerfile.fly, so a
          # scripts-only change must rebuild or it never reaches prod.
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile.fly'
            api:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile.fly'
              - 'fly.toml'
            worker:
              - 'backend/**'
              - 'scripts/**'
              - 'Dockerfile.fly'
              - 'fly.worker.toml'
            titiler:
              - 'fly.titiler.toml'
            frontend:
              - 'frontend/**'

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.x"
          python-version: "3.12"
      - name: Run backend tests
        run: |
          cd backend
          uv sync --locked --extra dev
          uv run --no-sync pytest -v

  # Blocking as a signal: a red run is visible on the PR and must be dealt
  # with. It still gates no deploy — the frontend ships through the Cloudflare
  # Pages GitHub integration, which watches the repo directly and never reads
  # an Actions result — so this job is deliberately absent from every deploy
  # job's needs. A real gate (a wrangler-driven Pages deploy behind this job)
  # is deferred to its own pass.
  #
  # The suite deliberately contains one test expected to fail, via it.fails:
  # H1's decennial half in HousingChart.test.tsx. (It was four until L8's
  # clear-before-resolve fix removed the three SearchInput.test.tsx markers in
  # the same commit that fixed the bug — the mechanism below, working.) Vitest
  # counts an it.fails test whose body throws as a pass, so the suite exits 0
  # with it present. When that bug is fixed the assertion starts passing,
  # it.fails reports it as a failure, and this job goes red — the fixing
  # commit must remove the marker and turn the test into an ordinary
  # regression guard. That is intended, not a broken test. See the
  # frontend-harness note in docs/audits/2026-08-second-audit/STATUS.md.
  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm test

  deploy-api:
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (master on 2026-08-22)
      # --build-arg stamps the image with the commit it was built from, so
      # GET /api/v1/health reports what is actually deployed.
      - run: |
          flyctl deploy --remote-only \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-worker:
    needs: [changes, test]
    if: needs.changes.outputs.worker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (master on 2026-08-22)
      - run: |
          flyctl deploy --remote-only --config fly.worker.toml \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-titiler:
    needs: changes
    if: needs.changes.outputs.titiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (master on 2026-08-22)
      - run: flyctl deploy --remote-only --config fly.titiler.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Frontend auto-deploys via Cloudflare Pages GitHub integration.
  # No explicit job needed if you connected the repo in the dashboard.
