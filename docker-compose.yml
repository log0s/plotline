services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plotline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plotline}
      POSTGRES_DB: ${POSTGRES_DB:-plotline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plotline} -d ${POSTGRES_DB:-plotline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Parity with the Fly build: local images report "dev" rather than a
      # SHA, which is exactly what /api/v1/health should say about them.
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plotline}:${POSTGRES_PASSWORD:-plotline}@postgres:5432/${POSTGRES_DB:-plotline}
      REDIS_URL: redis://redis:6379/0
      TITILER_URL: http://titiler:80
      API_INTERNAL_URL: http://api:8000
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      # Keep tool caches off the bind mount. The container runs as root and
      # ./backend is mounted at /app, so `make lint` and `make test` write
      # root-owned .ruff_cache / .mypy_cache / .pytest_cache into backend/ —
      # after which running the same tools on the *host* fails with EACCES.
      # ruff says "Failed to initialize cache"; mypy reports a bare INTERNAL
      # ERROR with no cause, which is a genuinely misleading way to learn the
      # problem is a directory owner. /tmp is container-local, so these leave
      # nothing behind in the repo.
      RUFF_CACHE_DIR: /tmp/ruff_cache
      MYPY_CACHE_DIR: /tmp/mypy_cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest_cache
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      titiler:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plotline}:${POSTGRES_PASSWORD:-plotline}@postgres:5432/${POSTGRES_DB:-plotline}
      REDIS_URL: redis://redis:6379/0
      TITILER_URL: http://titiler:80
      API_INTERNAL_URL: http://api:8000
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Prefork to match production (fly.worker.toml): Celery time limits are
    # silently ignored under the threads pool, and prefork keeps concurrent
    # tasks in separate processes.
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  titiler:
    image: ghcr.io/developmentseed/titiler:1.2.1
    ports:
      - "8001:80"
    environment:
      - WORKERS_PER_CORE=1
      - MAX_WORKERS=4
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      - GDAL_CACHEMAX=256
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_MAX_RETRY=3
      - GDAL_HTTP_RETRY_DELAY=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
